# El sitio en un VPS (docs/deploy/vps.md, ADR-0018).
#
# **Se levanta con `scripts/desplegar.sh`, no con `docker compose up` a
# secas.** La imagen `app` sale del build que corre el servicio `construir`
# después de migrar: el sitio se prerenderiza leyendo la base, y eso solo pasa
# adentro de esta red. Sin esa imagen, `up` no tiene de dónde sacarla.
#
# Solo `proxy` publica puertos. `app`, `db` y `analitica` se alcanzan nada más
# por la red interna, y por eso la app puede confiar en la IP que le pasa Caddy.
#
# Las variables salen del `.env` de al lado (ver `.env.example`).
#
# El proyecto se llama `ed`, salvo que `COMPOSE_PROJECT_NAME` diga otro (en el
# `.env`, para una segunda copia en el mismo servidor). De ese nombre salen los
# volúmenes, la red y las dos imágenes, `<proyecto>-fuente` y
# `<proyecto>-sitio`: los scripts de `scripts/` lo leen de acá y solo tocan
# las imágenes del suyo.

name: ed

x-base-de-la-app: &base-de-la-app
  DATABASE_URL: postgresql://ed:${CLAVE_DB_ED:?falta CLAVE_DB_ED en .env}@db:5432/ed
  DATABASE_URL_UNPOOLED: postgresql://ed:${CLAVE_DB_ED}@db:5432/ed

x-entorno-de-la-app: &entorno-de-la-app
  <<: *base-de-la-app
  NEXT_PUBLIC_SITE_URL: https://${DOMINIO:?falta DOMINIO en .env}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?falta BETTER_AUTH_SECRET en .env}
  CRON_SECRET: ${CRON_SECRET:?falta CRON_SECRET en .env}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  CORREO_REMITENTE: ${CORREO_REMITENTE:-}
  CV_ABIERTO: ${CV_ABIERTO:-}
  SEARCH_CONSOLE_CLIENT_EMAIL: ${SEARCH_CONSOLE_CLIENT_EMAIL:-}
  SEARCH_CONSOLE_PRIVATE_KEY: ${SEARCH_CONSOLE_PRIVATE_KEY:-}
  SEARCH_CONSOLE_SITE_URL: ${SEARCH_CONSOLE_SITE_URL:-}
  # Umami, por la red interna: de acá la copia diaria trae las visitas.
  UMAMI_API_URL: http://analitica:3000
  UMAMI_API_KEY: ${UMAMI_API_KEY:-}
  UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
  # Blob, solo si se quiere: sin token, las fotos y los CV van a sus volúmenes.
  BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
  CV_BLOB_READ_WRITE_TOKEN: ${CV_BLOB_READ_WRITE_TOKEN:-}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${CLAVE_DB_ADMIN:?falta CLAVE_DB_ADMIN en .env}
      CLAVE_DB_ED: ${CLAVE_DB_ED}
      CLAVE_DB_UMAMI: ${CLAVE_DB_UMAMI:?falta CLAVE_DB_UMAMI en .env}
    volumes:
      - datos-db:/var/lib/postgresql/data
      # Crea las bases `ed` y `umami`, cada una con su usuario, la primera vez.
      - ./deploy/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP: mientras corre la primera inicialización, Postgres escucha solo
      # en el socket, y así no se da por listo antes de tiempo.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrar:
    image: ${COMPOSE_PROJECT_NAME}-fuente:actual
    build:
      context: .
      target: fuente
    command: ["pnpm", "migrate:deploy"]
    environment: *base-de-la-app
    depends_on:
      db:
        condition: service_healthy

  construir:
    image: ${COMPOSE_PROJECT_NAME}-fuente:actual
    profiles: ["construir"]
    # Saca un tar por stdout: el contexto de la imagen `app`.
    command: ["sh", "deploy/construir.sh"]
    environment: *entorno-de-la-app
    depends_on:
      migrar:
        condition: service_completed_successfully

  herramientas:
    # Los comandos de apps/sitio/scripts/ con el entorno de la app, a mano:
    #   docker compose run --rm herramientas pnpm --filter sitio nombrar-direccion <correo>
    image: ${COMPOSE_PROJECT_NAME}-fuente:actual
    profiles: ["herramientas"]
    environment: *entorno-de-la-app
    depends_on:
      db:
        condition: service_healthy

  app:
    # La arma scripts/desplegar.sh con el commit como etiqueta; `actual` es la
    # que corre (scripts/volver.sh la cambia). El nombre, como el de la imagen
    # fuente, sale del proyecto (arriba).
    image: ${COMPOSE_PROJECT_NAME}-sitio:actual
    pull_policy: never
    restart: unless-stopped
    environment: *entorno-de-la-app
    volumes:
      - fotos:/app/apps/sitio/.fotos
      - cv:/app/apps/sitio/.cv
      # Las imágenes que optimiza next/image, para que sobrevivan al deploy:
      # regenerar una cuesta 100 a 300 ms, y servirla de la caché, 25.
      # desplegar.sh la vacía cuando cambia `public/`. No se respalda: se rehace.
      - imagenes:/app/apps/sitio/.next/cache/images
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/robots.txt"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      migrar:
        condition: service_completed_successfully

  analitica:
    # Umami, fijado: su API cambia entre versiones mayores, y el cliente de la
    # copia (lib/metricas/umami.ts) está probado contra esta.
    image: ghcr.io/umami-software/umami:3.4.0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${CLAVE_DB_UMAMI}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?falta UMAMI_APP_SECRET en .env}
      DISABLE_TELEMETRY: "1"
      # La IP, de la cabecera que pisa Caddy. Sin esto, Umami toma la primera
      # que encuentra de una lista (CF-Connecting-IP, entre otras), y esas las
      # puede mandar cualquiera.
      CLIENT_IP_HEADER: x-real-ip
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:3000/api/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  cron:
    # Todos los días a las 04:00 UTC (el contenedor está en UTC), la misma hora
    # que `apps/sitio/vercel.json`. Node trae el crond de busybox y `fetch`.
    image: node:24-alpine
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET}
    volumes:
      - ./deploy/cron:/etc/ed-cron:ro
    command:
      - sh
      - -c
      - >-
        umask 077 && mkdir -p /run/ed-cron &&
        printenv CRON_SECRET > /run/ed-cron/secreto &&
        echo "0 4 * * * node /etc/ed-cron/correr.mjs > /proc/1/fd/1 2>&1" | crontab - &&
        exec crond -f -l 8
    depends_on:
      app:
        condition: service_healthy

  respaldo:
    # Todos los días a las 03:30 UTC, antes del cron: las dos bases y los
    # archivos de fotos y CV en `respaldos/` del host (deploy/respaldo/). La
    # misma mayor de Postgres que `db`, para que pg_dump le hable.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${CLAVE_DB_ADMIN}
      DIAS_DE_RESPALDO: ${DIAS_DE_RESPALDO:-14}
      DUENO_DE_RESPALDOS: ${DUENO_DE_RESPALDOS:-1000:1000}
    volumes:
      - fotos:/datos/fotos
      - cv:/datos/cv
      - ./respaldos:/respaldos
      - ./deploy/respaldo:/respaldo:ro
    # crond no le pasa el entorno a sus trabajos: se lo deja en un archivo
    # que solo lee root.
    command:
      - sh
      - -c
      - >-
        umask 077 &&
        printenv | grep -E '^(PGPASSWORD|DIAS_DE_RESPALDO|DUENO_DE_RESPALDOS)=' | sed 's/^/export /' > /run/respaldo.env &&
        echo "30 3 * * * . /run/respaldo.env && sh /respaldo/respaldar.sh > /proc/1/fd/1 2>&1" | crontab - &&
        exec crond -f -l 8
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMINIO: ${DOMINIO}
      CORREO_ACME: ${CORREO_ACME:?falta CORREO_ACME en .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-datos:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
      analitica:
        condition: service_healthy

volumes:
  datos-db:
  fotos:
  cv:
  imagenes:
  caddy-datos:
  caddy-config:
