<meta name="DC.Description" xml:lang="en" content="Se presenta el diseño y evaluación de un taller semanal del Sistema Solar para niños (entre 8 y 13 años) como recurso didáctico para promover en los pequeños diferentes habilidades, entre ellas: que formulen preguntas de forma relajada y divertida, practiquen la lectura, reflexionen en información nueva y manipulen material relacionado con temas astronómicos del Sistema Solar.Los elementos didácticos utilizados en la propuesta son: historietas, construcción de modelos celestes con materiales de bajo costo y juegos de mesa; todos ellos enfocados en los temas astronómicos del Sistema Solar.Se muestran los resultados cualitativos más relevantes de la realización de este taller lúdico en dos ocasiones, obteniendo en general que en más del 90% de las sesiones, mas del 50% de los participantes lograron alcanzar los aprendizajes esperados, además de otros alcances no previstos inicialmente.
 
The design and evaluation of a weekly Solar System workshop for children (aged 8-13) is presented as a teaching resource to promote different skills in children, including: formulating questions in a relaxed and fun way, practicing reading, reflecting on new information, and manipulating materials related to astronomical topics of the Solar System.The educational elements used in the proposal include comics, construction of celestial models with low-cost materials, and board games, all focused on astronomical topics related to the Solar System.The most relevant qualitative results are shown from the performance of this recreational workshop on two occasions, with more than 50% of the participants achieving the expected learning outcomes in more than 90% of the sessions, in addition to other achievements not initially anticipated."/>
